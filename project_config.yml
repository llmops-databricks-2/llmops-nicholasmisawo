# Project configuration for the LLMOps course, filled in for you at onboarding.
# Resources are provisioned at onboarding except the volume, which you create during the course.
# embedding_endpoint is the serving endpoint for ai_query, AI Search and DatabricksServingEndpoint;
# embedding_service is the AI Gateway model service for the OpenAI client (README.md).

# Your usage policy: set it on every serverless job, endpoint and app you create.
usage_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"

# The agent's system prompt, tool guidance included, shared by every environment.
system_prompt_file: prompts/fcr_curator.txt

# Limits on the agent's turns and its tools' results (agent.py, agent_tools.py), shared by every environment.
agent:
  max_tool_rounds: 8           # A question needs 2 or 3; more means the model is going in circles
  history_messages: 20         # The last 10 exchanges: enough for follow-ups, without crowding the context
  answer_max_tokens: 4000      # Room for a reasoning model to think, then cite several FCRs
  default_search_results: 5
  max_search_results: 10       # More passages crowd the context without adding answers
  excerpt_chars: 800           # Enough to judge a passage; extract_fcr_content gives the whole page
  max_page_chars: 12000        # About 3,000 tokens: the longest FCR pages, with room for the rest of the turn

# MLflow traces in Unity Catalog (src/fcr_curator/tracing.py, notebooks/04_tracing), shared by every environment.
# Each experiment's traces go to <catalog>.<schema>.<prefix>_otel_spans and the views beside it; the agent and
# the tracing demos have their own prefixes, since an experiment name alone isolates nothing in the tables.
tracing:
  table_prefix: llmops                 # The course bound the agent experiments to these tables at onboarding
  demo_table_prefix: llmops_demo
  service_principal_secret: databricks_client_id   # The deploy service principal, granted write access by 4.0

# Evaluating, logging and registering the agent (src/fcr_curator/evaluation.py, scorers.py; lecture 4.3 and 4.4).
evaluation:
  cases_file: evaluation/fcr_eval_cases.yml
  human_labels_file: evaluation/human_labels.yml
  # A different model family from the agent's (gpt-oss-120b): a judge shouldn't grade its own model's answers
  judge_model: system.ai.claude-sonnet-5-5
  max_workers: 2            # Cases run at once; the agent's gateway allows 60 requests a minute per user
  model_name: fcr_agent     # Registered as <catalog>.<schema>.fcr_agent
  model_alias: latest-model

# Lakebase projects may be shared across environments; Unity Catalog
# schemas remain separate. Your cohort provisions the Lakebase values below.

# Development: your own schema in the dev catalog, which you manage and work in.
dev:
  catalog: "llmops_dev"
  schema: "nicholasmisawo"
  volume: "fcr_documents"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  warehouse_id: "86722fe1a817f6aa"
  experiment_path: "/llmops/nicholasmisawo-dev"
  # 4.1's teaching traces, apart from the agent's. In your workspace home (~): only the course can create in /llmops
  demo_experiment_path: "~/nicholasmisawo-dev-demos"
  # Your provisioned Lakebase project.
  lakebase_instance: "lb-llmops-nicholasmisawo"

# Acceptance: your schema in the acceptance catalog, written by your deploys; you read it.
acc:
  catalog: "llmops_acc"
  schema: "nicholasmisawo"
  volume: "fcr_documents"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  warehouse_id: "86722fe1a817f6aa"
  experiment_path: "/llmops/nicholasmisawo-acc"
  # Your provisioned Lakebase project for this environment.
  lakebase_instance: "lb-llmops-nicholasmisawo"

# Production: your schema in the production catalog, written by your deploys; you read it.
prd:
  catalog: "llmops_prd"
  schema: "nicholasmisawo"
  volume: "fcr_documents"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  warehouse_id: "86722fe1a817f6aa"
  experiment_path: "/llmops/nicholasmisawo-prd"
  # Your provisioned Lakebase project for this environment.
  lakebase_instance: "lb-llmops-nicholasmisawo"
