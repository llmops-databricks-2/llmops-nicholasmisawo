# Silver Consultation Papers
#
# Curates the bronze_consultation_papers table (PDFs only, classified,
# deduplicated) and upserts the result into silver_consultation_papers with an
# incremental MERGE. processed and volume_path stay None until DOWNLOAD_FILES
# is set to True in the notebook; then the curated PDFs are downloaded to the
# Unity Catalog volume and those columns are filled in. Requires the bronze
# table, so run the bronze_consultation_papers job at least once first.
#
# Runs as a Databricks serverless notebook task using the packaged
# project wheel. The target environment (dev/acc/prd) determines the
# catalog, schema, and configuration loaded from project_config.yml.
# Job names follow the medallion layer they write (bronze sorts before
# silver), and are environment-specific to prevent deployment conflicts.

resources:
  jobs:
    silver_consultation_papers:
      name: silver_consultation_papers-${bundle.target}
      budget_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: silver_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/silver_consultation_papers.py
            base_parameters:
              env: ${bundle.target}
