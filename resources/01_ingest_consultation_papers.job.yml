# 01 Consultation Papers Ingestion
#
# Retrieves Bermuda Monetary Authority consultation and discussion papers
# (current and archived), tagged with category and topic/sector filters, and
# upserts them into the bronze_consultation_papers Delta table. Then curates
# bronze (PDFs only, classified, deduplicated) and upserts the result into
# silver_consultation_papers, where new papers have processed and volume_path
# as None. Both writes are incremental MERGEs, so re-runs are safe. Downloads
# nothing; run the 02_download_consultation_papers job to fetch the PDFs.
#
# Runs as a Databricks serverless notebook task using the packaged
# project wheel. The target environment (dev/acc/prd) determines the
# catalog, schema, and configuration loaded from project_config.yml.
# Job names are numbered so they sort in run order in the Jobs UI, and
# environment-specific to prevent deployment conflicts.

resources:
  jobs:
    01_ingest_consultation_papers:
      name: 01_ingest_consultation_papers-${bundle.target}
      budget_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: 01_ingest_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/01_ingest_consultation_papers.py
            base_parameters:
              env: ${bundle.target}
