# Consultation Papers Pipeline
#
# One job running the medallion stages in order, each task starting only
# once the one before it succeeds:
#
#   bronze_consultation_papers   fetch BMA document metadata and upsert bronze
#   silver_consultation_papers   curate bronze into silver, download new PDFs
#   process_consultation_papers  parse, chunk and embed newly downloaded papers
#
# Every stage is incremental, so re-runs only pick up new or changed papers.
# A single stage can still be run on its own from the job page by choosing
# that task when starting a run.
#
# Runs weekly, Mondays at 06:00 Bermuda time: the BMA publishes consultations
# infrequently, and comment periods run for weeks. The schedule is paused
# everywhere except prd (schedule_pause_status in databricks.yml).
#
# Runs as Databricks serverless notebook tasks using the packaged project
# wheel. The target environment (dev/acc/prd) determines the catalog,
# schema, and configuration loaded from project_config.yml. The job name is
# environment-specific because every target deploys to the same workspace.

resources:
  jobs:
    consultation_papers_pipeline:
      name: consultation_papers_pipeline-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Atlantic/Bermuda"
        pause_status: ${var.schedule_pause_status}
      budget_policy_id: ${var.usage_policy_id}
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/bronze_consultation_papers.py
            base_parameters:
              env: ${bundle.target}

        - task_key: silver_consultation_papers
          depends_on:
            - task_key: bronze_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/silver_consultation_papers.py
            base_parameters:
              env: ${bundle.target}

        - task_key: process_consultation_papers
          depends_on:
            - task_key: silver_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_processing/process_consultation_papers.py
            base_parameters:
              env: ${bundle.target}
