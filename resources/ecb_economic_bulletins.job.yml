# ECB Economic Bulletins Ingestion
#
# Retrieves ECB Economic Bulletin publications, including metadata
# and full-text content, for monetary policy and FX market research.
# Stores publications in Unity Catalog Delta tables for subsequent
# document processing, embedding, and RAG-based retrieval.
#
# Runs as a Databricks serverless notebook task using the packaged
# project wheel. The target environment (dev/acc/prd) determines the
# catalog, schema, and configuration loaded from project_config.yml.
# Job names are environment-specific to prevent deployment conflicts.

resources:
  jobs:
    ecb_economic_bulletins:
      name: ecb_economic_bulletins-${bundle.target}
      budget_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ecb_economic_bulletins
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/03_ingest_ecb_economic_bulletins.py
            base_parameters:
              env: ${bundle.target}
