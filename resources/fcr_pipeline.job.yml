# FCR Pipeline
#
# One job running the medallion stages in order, each task starting only
# once the one before it succeeds:
#
#   dbt_seed               load and test the reference list (dbt seed ref_bermuda_reinsurers)
#   bronze_fcr_documents   search for FCRs with SerpAPI and on disclosures pages; upsert bronze
#   silver_fcr_documents   curate bronze into silver, download new PDFs
#   process_fcr_documents  parse, chunk and embed newly downloaded FCRs
#   dbt_context            dbt: staging -> intermediate -> context (section chunks, embeddings)
#                          -> fcr_knowledge_base, plus the dim_fcr_companies coverage mart
#   sync_fcr_chunks_to_lakebase  create or refresh the Lakebase synced table of the chunks
#
# Every stage is incremental, so re-runs only pick up new or changed FCRs.
# A single stage can still be run on its own from the job page by choosing
# that task when starting a run.
#
# Runs weekly, Mondays at 06:00 Bermuda time: insurers publish FCRs once a
# year, mostly in the months after their year-end filing deadlines, and every
# run's searches are billed by SerpAPI. The schedule is paused everywhere
# except prd (schedule_pause_status in databricks.yml).
#
# Runs as Databricks serverless notebook tasks using the packaged project
# wheel. The target environment (dev/acc/prd) determines the catalog,
# schema, and configuration loaded from project_config.yml. The job name is
# environment-specific because every target deploys to the same workspace.

resources:
  jobs:
    fcr_pipeline:
      name: fcr_pipeline-${bundle.target}
      # One run at a time: every run writes the same tables, so a second start queues until the first ends
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Atlantic/Bermuda"
        pause_status: ${var.schedule_pause_status}
      budget_policy_id: ${var.usage_policy_id}
      # Passed to every task's notebook as a widget. dry_run=true makes bronze print its search plan
      # and budget without spending any SerpAPI searches, e.g.
      #   databricks bundle run fcr_pipeline -t dev --only bronze_fcr_documents --params dry_run=true
      parameters:
        - name: env
          default: ${bundle.target}
        - name: dry_run
          default: "false"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
        # dbt has its own environment: dbt-databricks pins a databricks-sdk the wheel can't share
        - environment_key: dbt
          spec:
            environment_version: "6"
            dependencies:
              - dbt-databricks>=1.10,<2

      tasks:
        # dbt tasks run the dbt/ folder this bundle uploads, on the SQL warehouse; Databricks writes the
        # dbt profile for them from warehouse_id, catalog and schema (dbt/profiles.yml is for local runs)
        - task_key: dbt_seed
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ../dbt
            commands:
              - dbt deps
              - dbt build --select bermuda_reinsurers
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

        - task_key: bronze_fcr_documents
          depends_on:
            - task_key: dbt_seed
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/bronze_fcr_documents.py

        - task_key: silver_fcr_documents
          depends_on:
            - task_key: bronze_fcr_documents
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/silver_fcr_documents.py

        - task_key: process_fcr_documents
          depends_on:
            - task_key: silver_fcr_documents
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_processing/process_fcr_documents.py

        - task_key: dbt_context
          depends_on:
            - task_key: process_fcr_documents
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ../dbt
            # The Python models install the deployed wheel (its version comes from version.txt)
            commands:
              - dbt deps
              - >-
                dbt build --select +fcr_knowledge_base dim_fcr_companies
                --vars '{fcr_curator_wheel: ${workspace.artifact_path}/.internal/fcr_curator-0.0.1-py3-none-any.whl}'
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

        - task_key: sync_fcr_chunks_to_lakebase
          depends_on:
            - task_key: dbt_context
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_retrieval/sync_fcr_chunks_to_lakebase.py
