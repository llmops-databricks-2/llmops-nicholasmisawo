# FCR Pipeline
#
# One job running the stages in order, each task starting only once the one
# before it succeeds. Python only talks to the outside world and appends what
# it saw; dbt builds everything else:
#
#   dbt_search_plan           load the reference list (seed), plan the searches due -> fcr_search_plan
#   search_fcrs               ask the plan within budget, read the disclosures pages; append what was found
#   dbt_register              work out the search results, curate them into fcr_register
#   download_fcrs             download the register's new PDFs; appends every attempt
#   dbt_context               parse the new PDFs (ai_parse_document), section chunks, embeddings
#                             -> fcr_knowledge_base, plus the dim_fcr_companies coverage mart
#   sync_knowledge_base_to_lakebase  create or refresh the Lakebase copy of fcr_knowledge_base
#
# Every stage is incremental or append-only, so re-runs only pick up new or changed FCRs.
# A single stage can still be run on its own from the job page by choosing
# that task when starting a run.
#
# Runs weekly, Mondays at 06:00 Bermuda time: insurers publish FCRs once a
# year, mostly in the months after their year-end filing deadlines, and every
# run's searches are billed by SerpAPI. The schedule is paused everywhere
# except prd (schedule_pause_status in databricks.yml).
#
# Runs as Databricks serverless notebook tasks using the packaged project
# wheel. The target environment (dev/acc/prd) determines the catalog,
# schema, and configuration loaded from project_config.yml. The job name is
# environment-specific because every target deploys to the same workspace.

resources:
  jobs:
    fcr_pipeline:
      name: fcr_pipeline-${bundle.target}
      # One run at a time: every run writes the same tables, so a second start queues until the first ends
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Atlantic/Bermuda"
        pause_status: ${var.schedule_pause_status}
      budget_policy_id: ${var.usage_policy_id}
      # Passed to every task's notebook as a widget. dry_run=true makes search_fcrs print its search plan
      # and budget without spending any SerpAPI searches, e.g.
      #   databricks bundle run fcr_pipeline -t dev --only dbt_search_plan,search_fcrs --params dry_run=true
      parameters:
        - name: env
          default: ${bundle.target}
        - name: dry_run
          default: "false"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
        # dbt has its own environment: dbt-databricks pins a databricks-sdk the wheel can't share
        - environment_key: dbt
          spec:
            environment_version: "6"
            dependencies:
              - dbt-databricks>=1.10,<2

      tasks:
        # dbt tasks run the dbt/ folder this bundle uploads, on the SQL warehouse; Databricks writes the
        # dbt profile for them from warehouse_id, catalog and schema (dbt/profiles.yml is for local runs).
        # Their Python models install the deployed wheel (its version comes from version.txt).
        # The plan reads the register as the searches so far make it, so this also rebuilds the register
        - task_key: dbt_search_plan
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ../dbt
            commands:
              - dbt deps
              - >-
                dbt build --select +fcr_search_plan
                --vars '{fcr_curator_wheel: ${workspace.artifact_path}/.internal/fcr_curator-0.0.1-py3-none-any.whl}'
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

        - task_key: search_fcrs
          depends_on:
            - task_key: dbt_search_plan
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/search_fcrs.py

        # The register again, now with this run's searches
        - task_key: dbt_register
          depends_on:
            - task_key: search_fcrs
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ../dbt
            commands:
              - dbt deps
              - >-
                dbt build --select +fcr_register
                --vars '{fcr_curator_wheel: ${workspace.artifact_path}/.internal/fcr_curator-0.0.1-py3-none-any.whl}'
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

        - task_key: download_fcrs
          depends_on:
            - task_key: dbt_register
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/download_fcrs.py

        # Everything downstream of the downloaded FCRs; the register was built by dbt_register
        - task_key: dbt_context
          depends_on:
            - task_key: download_fcrs
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ../dbt
            commands:
              - dbt deps
              - >-
                dbt build --select int_fcr_documents+
                --vars '{fcr_curator_wheel: ${workspace.artifact_path}/.internal/fcr_curator-0.0.1-py3-none-any.whl}'
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

        - task_key: sync_knowledge_base_to_lakebase
          depends_on:
            - task_key: dbt_context
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_retrieval/sync_knowledge_base_to_lakebase.py
