# 02 Consultation Papers Download
#
# Downloads the PDFs of curated papers not yet in the Unity Catalog volume
# and records processed and volume_path for each in the
# silver_consultation_papers table, for subsequent document processing and
# RAG-based retrieval. Requires the silver table, so run the
# 01_ingest_consultation_papers job at least once first.
#
# Runs as a Databricks serverless notebook task using the packaged
# project wheel. The target environment (dev/acc/prd) determines the
# catalog, schema, and configuration loaded from project_config.yml.
# Job names are numbered so they sort in run order in the Jobs UI, and
# environment-specific to prevent deployment conflicts.

resources:
  jobs:
    02_download_consultation_papers:
      name: 02_download_consultation_papers-${bundle.target}
      budget_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: 02_download_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/02_download_consultation_papers.py
            base_parameters:
              env: ${bundle.target}
