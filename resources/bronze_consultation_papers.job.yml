# Bronze Consultation Papers
#
# Retrieves Bermuda Monetary Authority consultation and discussion papers
# (current and archived), tagged with category and topic/sector filters, and
# upserts them into the bronze_consultation_papers Delta table with an
# incremental MERGE, so re-runs are safe. Downloads nothing; run the
# silver_consultation_papers job next to curate them.
#
# Runs as a Databricks serverless notebook task using the packaged
# project wheel. The target environment (dev/acc/prd) determines the
# catalog, schema, and configuration loaded from project_config.yml.
# Job names follow the medallion layer they write (bronze sorts before
# silver), and are environment-specific to prevent deployment conflicts.

resources:
  jobs:
    bronze_consultation_papers:
      name: bronze_consultation_papers-${bundle.target}
      budget_policy_id: "ffe08ae3-a783-3201-ab0c-2fff24538807"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze_consultation_papers
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingestion/bronze_consultation_papers.py
            base_parameters:
              env: ${bundle.target}
