# Local runs sign in with your browser (OAuth); the Databricks dbt task makes its own profile instead.
# Catalogs and schema match project_config.yml.
fcr_curator:
  target: dev
  outputs:
    dev: &defaults
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'dbc-e81ca4d2-f6bd.cloud.databricks.com') }}"
      http_path: /sql/1.0/warehouses/86722fe1a817f6aa
      auth_type: oauth
      catalog: llmops_dev
      schema: nicholasmisawo
      threads: 4
    acc:
      <<: *defaults
      catalog: llmops_acc
    prd:
      <<: *defaults
      catalog: llmops_prd
