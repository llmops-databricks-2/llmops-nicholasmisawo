version: 2

models:
  - name: stg_fcr_search_hits
    description: Every FCR PDF each search run found, one row per run and URL.
    columns:
      - name: document_id
        data_tests: [not_null]
      - name: landed_at
        description: When the run that found it landed its rows; one value per run, so runs sort in order.
        data_tests: [not_null]

  - name: stg_fcr_searches
    description: Every billed SerpAPI search, one row per results page.
    columns:
      - name: query
        data_tests: [not_null]

  - name: stg_fcr_page_reads
    description: Every disclosures page that loaded, as the query that found its PDFs (page:<url>).
    columns:
      - name: query
        data_tests: [not_null]

  - name: stg_fcr_download_attempts
    description: Every attempt to fetch an FCR's PDF.
    columns:
      - name: outcome
        data_tests: [{accepted_values: {arguments: {values: [downloaded, failed, rejected]}}}]

  - name: stg_fcr_volume_files
    description: The FCR PDFs downloaded into the volume, one row per file.
    columns:
      - name: volume_path
        description: The file's path in the volume, /Volumes/<catalog>/<schema>/<volume>/<source>/<document_id>.<file_type>.
        data_tests: [unique, not_null]
      - name: downloaded_at
        description: When the file arrived (its modified time; a file is never rewritten).

  - name: stg_fcr_entities
    description: The reference list of Bermuda entities (insurers and reinsurers), with multi-value columns as arrays.
    columns:
      - name: name
        data_tests: [unique, not_null]
