# Databricks Asset Bundle of llmops-nicholasmisawo, shaped like the course's llmops-course-code.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: llmops-nicholasmisawo

# The course package is built as a wheel and installed in every job environment.
artifacts:
  default:
    type: whl
    build: uv build
    path: .

include:
  - resources/*.yml

# Set once here and referenced by every job, so the policy id isn't repeated per resource
variables:
  usage_policy_id:
    description: Usage policy set on every serverless job, endpoint and app (see project_config.yml)
    default: "ffe08ae3-a783-3201-ab0c-2fff24538807"
  schedule_pause_status:
    description: PAUSED or UNPAUSED; only prd runs on its schedule (development mode pauses dev anyway)
    default: PAUSED
  # The dbt tasks need these directly; they match project_config.yml
  catalog:
    description: Unity Catalog catalog the target writes to
    default: llmops_dev
  schema:
    description: Schema within the catalog
    default: nicholasmisawo
  warehouse_id:
    description: SQL warehouse the dbt tasks run on
    default: "0e56acba898dad4a"

# Three targets in the one course workspace, each writing your schema in its own catalog
# (project_config.yml). Each is deployed under the home folder of whoever deploys it: you from your
# laptop. A deployment workflow is introduced in a later lecture. The workspace host is
# set, so `databricks bundle validate -t dev` needs no profile to find it.
targets:
  # Your sandbox. Development mode prefixes every resource with "[dev" and the deployer's name,
  # so your own deploy and the pipeline's never collide.
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  # Acceptance: deployed on every merge to main.
  acc:
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      catalog: llmops_acc

  # Production: deployed after acceptance, once you approve it.
  prd:
    workspace:
      host: https://dbc-88df4c2c-4033.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      catalog: llmops_prd
      schedule_pause_status: UNPAUSED
